# config.yaml — Agent configuration
#
# Edit this file to change agent settings, then run:
#   ./apply-config.sh
#
# ── Model assignments ────────────────────────────────────────────────────────
#
# Model format: provider/model-id
#
# Available providers:
#   anthropic  — Anthropic cloud API (requires anthropic_api_key in secrets.yaml)
#   vllm       — Local model on Spark (no API key required)
#   argo       — Argonne LCRC API gateway (requires argo_api_key in secrets.yaml)
#                Requires active tunnel: ssh -N -L 8443:lambd5:443 <user>@lambda.lcrc.anl.gov
#
# Anthropic models (current as of 2026-03):
#   (cost is $in/$out per million tokens)
#   anthropic/claude-haiku-4-5      fast and cheap ($1/$25)
#   anthropic/claude-sonnet-4-6     balanced (recommended default) ($3/$15)
#   anthropic/claude-opus-4-6       most capable, slowest/most expensive ($5/$5)
#
# Local vLLM model:
#   vllm/Qwen/Qwen3-Coder-Next-FP8
#
# Argonne Argo models (see providers.argo.models below for full list):
#   argo/argo:claude-4.6-sonnet     balanced, recommended  (no cost -- internal)
#   argo/argo:claude-4.6-opus       most capable           (no cost -- internal)
#   argo/argo:claude-4.5-haiku      fast, lightweight      (no cost -- internal)

# ── Defaults ─────────────────────────────────────────────────────────────────
#
# Global defaults applied to all agents.
#
# fallback_model: Model to use if the primary model is unreachable (tunnel down,
#   provider outage, rate limit, etc.). OpenClaw tries the primary first, then
#   falls back automatically on connection errors, timeouts, or 5xx responses.
#   Leave unset to disable automatic fallback.
#   Recommended: set to vllm (local) so agents keep working if Internet is lost.

defaults:
  fallback_model: vllm/Qwen/Qwen3-Coder-Next-FP8

agents:
  luoji:
    model: argo/argo:claude-4.6-sonnet
  chattpc26:
    model: argo/argo:claude-4.6-sonnet
    tools:
      deny:
        - web_search
        - web_fetch
    sandbox:
      browser:
        enabled: false
  cecat:
    model: argo/argo:claude-4.6-sonnet

# ── Web search and fetch tools ───────────────────────────────────────────────
#
# web_search and web_fetch are enabled for all agents except chattpc26 (which
# has them in its deny list below). Brave API key goes in secrets.yaml as
# brave_search_api_key. Free tier: 2,000 queries/month (api.search.brave.com).
tools:
  web:
    search:
      enabled: true
      provider: brave
    fetch:
      enabled: true


# ── Browser tool ─────────────────────────────────────────────────────────────
#
# Enables the built-in OpenClaw browser for JS-heavy pages and Google Form
# filling. Uses a persistent profile so tpc26agent@gmail.com stays logged in.
#
# Per-agent access: set sandbox.browser.enabled: false in the agent block to
# prevent an agent from using the browser (see chattpc26 below).
#
# After enabling, authenticate tpc26agent@gmail.com by opening the OpenClaw
# dashboard, triggering a browser session for luoji or cecat, navigating to
# accounts.google.com, and signing in. OpenClaw persists the session in its
# internal browser profile automatically.
browser:
  enabled: true
  ssrfPolicy:
    allowPrivateNetwork: false

# ── Custom provider definitions ───────────────────────────────────────────────
#
# Defines providers that are not natively supported by OpenClaw (i.e. not
# "anthropic" or "vllm"). Each provider block is written into openclaw.json
# models.providers.{name} by apply-config.sh.
#
# API keys are read from secrets.yaml using the key {provider_name}_api_key.
# (e.g. argo_api_key for the argo provider)
#
# Required fields per model: id, name, contextWindow, maxTokens
# Defaults applied automatically: reasoning: false, input: [text], cost: all zeros

providers:
  argo:
    baseUrl: "http://172.18.0.1:44497"
    api: "anthropic-messages"
    models:
      - id: "argo:claude-4.6-sonnet"
        name: "claude-4.6-sonnet (Argo)"
        contextWindow: 16000
        maxTokens: 16000
      - id: "argo:claude-4.6-opus"
        name: "claude-4.6-opus (Argo)"
        contextWindow: 16000
        maxTokens: 16000
      - id: "argo:claude-4.5-haiku"
        name: "claude-4.5-haiku (Argo)"
        contextWindow: 16000
        maxTokens: 16000

# ── Slack channel → agent bindings ───────────────────────────────────────────
#
# Controls which agent handles each Slack channel. Maps to the `bindings` array
# in openclaw.json. The default agent (main) handles all DMs and any channel
# not listed here.
#
# To find a channel ID: right-click the channel in Slack → View channel details
# → copy the ID from the bottom of the About tab (starts with C).
#
# Format:
#   channels:
#     - id: <channel-id>     # Slack channel ID (e.g. C09KGGMS116)
#       name: "<name>"       # Human-readable label (not used by OpenClaw, for reference)
#       agent: <agent-id>    # Agent that handles this channel
#
# Channels with full links
# pc-tpc26:         https://trillionparam-5lp9574.slack.com/archives/C09KGGMS116
# agent-chattpc26:  https://trillionparam-5lp9574.slack.com/archives/C0AJ1EL2KJ5
# hackathon-cineca: https://trillionparam-5lp9574.slack.com/archives/C0AEFU5GX5Z       
#
# agent-cecat:      https://trillionparam-5lp9574.slack.com/archives/C0AMYPF9NDN
#
# agent-luoji:      https://trillionparam-5lp9574.slack.com/archives/C0AMBT2GD97
# claws:            https://trillionparam-5lp9574.slack.com/archives/C0AQH73GEHM

channels:

    # agent chattpc26
  - id: C09KGGMS116
    name: "#pc-tpc25"
    agent: chattpc26
  - id: C0AEFU5GX5Z
    name: "#hackathon-cineca"
    agent: chattpc26
  - id: C0AJ1EL2KJ5
    name: "#agent-chattpc26"
    agent: chattpc26

    # agent cecat
  - id: C0AMYPF9NDN
    name: "#agent-cecat"
    agent: cecat

    # agent luoji
  - id: C0AMBT2GD97
    name: "#agent-luoji"
    agent: luoji
  - id: C0AQH73GEHM
    name: "#claws"
    agent: luoji

# ── Notify pipeline settings ─────────────────────────────────────────────────
#
# Used by run-notify.sh / notify.py for the daily sync and notification pipeline.

notify:
  dry_run_slack_channel_id: C0AJ1EL2KJ5   # #openclaw-test
  system_owner_email: catlett@anl.gov
