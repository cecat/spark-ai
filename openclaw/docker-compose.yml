# docker-compose.yml — OpenClaw gateway
# Security: gateway bound to Tailscale IP only; workspace scoped to single folder
#
# BEFORE FIRST USE: Create a .env file in the same directory as this docker-compose.yml, with contents:
# TAILSCALE_IP=x.x.x.x
# OPENCLAW_WORKSPACE=<your_home_dir_path>/openclaw-workspace
#
# You will find your TAILSCALE IP using "tailscale ip -4" 
#
# DO NOT change the ports: binding to 0.0.0.0 — this would expose the gateway
#   to your LAN and potentially the internet.
# DO NOT add volume mounts for ~/.ssh, ~/, or /etc.
# Credential mounts (gogcli, slack) are explicitly listed below — add others only
# in the same pattern (specific ~/.config/<tool> subdir, read-only).
# DO NOT override the user: directive — OpenClaw must run as non-root (node/uid 1000).
# See README.md for full security notes.

services:
  openclaw-gateway:
    # Pin to explicit version — was ':latest' but that auto-pulled 6.8 on 2026-06-16
    # without the doctor --fix / plugin-install migration steps, causing the
    # 2026-07-10 gateway crash-loop. Bump this tag deliberately, following the
    # sequence in UPGRADE-2026.6.8.md § "Recommended upgrade sequence".
    image: ghcr.io/openclaw/openclaw:2026.6.11
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      # IMPORTANT: bind to Tailscale IP only — not 0.0.0.0
      - "${TAILSCALE_IP}:18789:18789"
    group_add:
      - "988"
    volumes:
      # OpenClaw config and memory — internal use only
      - openclaw-config:/home/node/.openclaw
      # Luoji session logs surfaced to a host path so the spark-fabric FALDA tap
      # can read them directly (they otherwise live only inside this named
      # volume). Host dir is OUTSIDE any agent workspace/sandbox mount by design
      # — the luoji sandbox must not see or write its own raw session logs.
      # Runtime state, not source: lives in $HOME, not a repo. See
      # spark-fabric/runlog/RUNLOG-2026-07-28-bringup.md.
      - /home/catlett/.openclaw-sessions/luoji:/home/node/.openclaw/agents/luoji/sessions:rw
      # Workspace — the ONLY host folder the agent can read/write
      - ${OPENCLAW_WORKSPACE}:/home/node/agents:rw
      # Same-path mount: OpenClaw uses the workspace path from openclaw.json as the
      # Docker bind source when spawning sandbox containers. That path must exist on
      # the HOST. By mounting the workspace at its own host path, the gateway can
      # read it AND sandbox containers get the correct bind source. Without this,
      # sandboxes would mount from /home/node/agents/* (a gateway-internal path that
      # creates empty root-owned dirs on the host). See README.md Step 8.
      - ${OPENCLAW_WORKSPACE}:${OPENCLAW_WORKSPACE}:rw
      # Docker binary — needed to fire up sandboxes
      - /usr/bin/docker:/usr/bin/docker:ro
      # Docker socket — required for sandbox container spawning
      - /var/run/docker.sock:/var/run/docker.sock
      # gog credentials — read-only, for Google Workspace access
      - /home/catlett/.config/gogcli:/home/catlett/.config/gogcli:ro
      # Slack bot token — read-only, for posting to Slack via send-slack-posts.sh
      - /home/catlett/.config/slack:/home/catlett/.config/slack:ro
      # gog skills
      - /home/catlett/.agents:/home/node/.agents:ro
    environment:
      - NODE_ENV=production
      - OPENAI_API_BASE=http://nim:8000/v1
      - OPENAI_API_KEY=dummy
    # No dns: override — 10.0.4.1 (LAN gateway) is unreachable from containers,
    # costing a 4s resolver timeout on every lookup and starving MCP startup.
    networks:
      - nim_net
    # Runs as non-root node user (uid 1000) — do not override with user: root

  openclaw-cli:
    # Pinned to match the gateway above. Was ':latest', which is how the
    # 2026-06-16 auto-pull happened; a CLI on a different version than the
    # gateway can also write config the gateway then rejects. Bump both
    # together. (Day-to-day, prefer `docker exec openclaw-gateway
    # node dist/index.js <cmd>` — this container cannot reach a
    # Tailscale-bound gateway over WebSocket.)
    image: ghcr.io/openclaw/openclaw:2026.6.11
    profiles:
      - cli
    volumes:
      - openclaw-config:/home/node/.openclaw
    networks:
      - nim_net
    entrypoint: ["node", "dist/index.js"]

volumes:
  openclaw-config:

networks:
  nim_net:
    external: true
    name: qwen3-coder-next_nim_net
    # This network is created by qwen3-coder-next/docker-compose.yml
    # vLLM (qwen3-coder-next) must be started before OpenClaw
